# .github/workflows/render-post.yml
#
# Ito yung gumagawa ng image. Tinatawag ito ng n8n gamit ang repository_dispatch.
# Kinukuha nito yung design JSON, ginagawang JPEG, tapos kinokomit sa docs/posts/
# kaya may agad na PUBLIC URL sa GitHub Pages — kailangang-kailangan yun ng
# Instagram API kasi hindi ito tumatanggap ng file upload, URL lang.
#
# Kusang hinahanap nito kung nasa root o nasa render/ folder ang render.js,
# kaya kahit saan mo ilagay ang mga file, gagana pa rin.
name: Render post image

on:
  repository_dispatch:
    types: [render-post]
  workflow_dispatch:
    inputs:
      slug:
        description: 'Filename slug, hal. 2026-08-23'
        required: true
      design:
        description: 'Design JSON (isang linya)'
        required: true

permissions:
  contents: write

concurrency:
  group: render-post
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hanapin kung nasaan ang render.js
        id: loc
        run: |
          if [ -f render/render.js ]; then
            D=render
            echo "Nasa render/ folder ang mga file."
          elif [ -f render.js ]; then
            D=.
            echo "Nasa root ang mga file."
          else
            echo "::error::Hindi mahanap ang render.js — nasa root man o sa render/ folder."
            echo "Laman ng repo:"; ls -la
            exit 1
          fi

          for f in template.html fonts.css package.json package-lock.json; do
            if [ ! -f "$D/$f" ]; then
              echo "::error::Wala ang $D/$f — kailangan ito."
              echo "Laman ng $D:"; ls -la "$D"
              exit 1
            fi
          done

          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          # glob, kaya tumutugma kahit nasa root o nasa render/
          cache-dependency-path: '**/package-lock.json'

      - name: Install deps (kasama na yung Chromium)
        working-directory: ${{ steps.loc.outputs.dir }}
        run: npm ci

      - name: Isulat yung design payload
        env:
          DESIGN: ${{ github.event.client_payload.design || inputs.design }}
        run: |
          mkdir -p /tmp/render
          printf '%s' "$DESIGN" > /tmp/render/design.json
          echo "--- payload ---"
          cat /tmp/render/design.json

      - name: I-render yung JPEG
        working-directory: ${{ steps.loc.outputs.dir }}
        env:
          SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
        run: |
          # safety check: ligtas na pangalan lang, walang path traversal
          case "$SLUG" in
            *[!a-zA-Z0-9._-]* | "" ) echo "::error::Bawal na slug: $SLUG"; exit 1 ;;
          esac
          mkdir -p "$GITHUB_WORKSPACE/docs/posts"
          node render.js --in /tmp/render/design.json \
                         --out "$GITHUB_WORKSPACE/docs/posts/${SLUG}.jpg"

      - name: I-commit at i-publish
        env:
          SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
        run: |
          git config user.name  "anyaya-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "docs/posts/${SLUG}.jpg"
          if git diff --staged --quiet; then
            echo "Walang pagbabago."
          else
            git commit -m "post: render ${SLUG}"
            git push
          fi

      - name: Ipakita yung public URL
        env:
          SLUG: ${{ github.event.client_payload.slug || inputs.slug }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          URL="https://${OWNER}.github.io/${{ github.event.repository.name }}/posts/${SLUG}.jpg"
          echo "### 🖼️ $URL" >> "$GITHUB_STEP_SUMMARY"
