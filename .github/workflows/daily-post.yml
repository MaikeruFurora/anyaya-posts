# Ang orasan. Ito lang ang ginagawa nito — ang totoong trabaho ay nasa
# make-post.yml, na ginagamit din ng "skip and generate".
name: Daily post

on:
  schedule:
    # 22:00 UTC = 6:00 AM sa Maynila. Nahuhuli ang GitHub nang 10-30 minuto
    # kapag matao — walang halaga iyon sa araw-araw na post.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Petsa (YYYY-MM-DD). Iwan kung ngayon.'
        required: false
      dry:
        description: 'Huwag tawagan ang Gemini — halimbawa lang'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: make-post
  cancel-in-progress: false

jobs:
  make:
    uses: ./.github/workflows/make-post.yml
    secrets: inherit
    with:
      date: ${{ inputs.date }}
      dry:  ${{ inputs.dry == true }}
      variation: 0
