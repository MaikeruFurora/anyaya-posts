# Isang post kada araw. Buo — walang tinatawagang panlabas na serbisyo maliban
# sa Gemini. Walang serverong pwedeng matulog o mamatay.
name: Daily post

on:
  schedule:
    # 22:00 UTC = 6:00 AM sa Maynila. Nahuhuli ang GitHub nang 10-30 minuto
    # kapag matao — walang halaga iyon sa araw-araw na post.
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Petsa (YYYY-MM-DD). Iwan kung ngayon.'
        required: false
      dry:
        description: 'Huwag tawagan ang Gemini — halimbawa lang'
        type: boolean
        default: false

permissions:
  contents: write      # para ma-commit ang larawan sa docs/posts/
  issues: write        # para mabuksan ang approval issue

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json

      # Nagda-download ang Puppeteer ng sariling Chrome (~150 MB). Ini-imbak
      # natin ito para hindi ito ulitin araw-araw — at para hindi tayo
      # nakasalalay sa isang download tuwing umaga.
      - name: Kunin ang naka-imbak na Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('render/package-lock.json') }}

      - name: I-install ang renderer
        working-directory: render
        run: npm ci

      - name: Isulat ang post
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   ${{ vars.GEMINI_MODEL }}
        run: |
          ARGS="--out-dir /tmp/post"
          [ -n "${{ inputs.date }}" ] && ARGS="$ARGS --date ${{ inputs.date }}"
          [ "${{ inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          node bot/generate.js $ARGS
          echo "slug=$(node -p "require('/tmp/post/post.json').slug")" >> "$GITHUB_OUTPUT"

      - name: Gawing larawan
        run: |
          mkdir -p docs/posts
          node render/render.js \
            --in /tmp/post/design.json \
            --out "docs/posts/${{ steps.gen.outputs.slug }}.jpg"
          ls -la "docs/posts/${{ steps.gen.outputs.slug }}.jpg"

      - name: I-commit ang larawan at ang caption
        run: |
          # Kasama ang post.json: ito ang babasahin ng publish workflow kapag
          # nag-approve ka. Walang database — ang repo mismo ang tala.
          cp /tmp/post/post.json "docs/posts/${{ steps.gen.outputs.slug }}.json"

          git config user.name  'anyaya-bot'
          git config user.email 'anyaya-bot@users.noreply.github.com'
          git add "docs/posts/${{ steps.gen.outputs.slug }}.jpg" \
                  "docs/posts/${{ steps.gen.outputs.slug }}.json"
          git commit -m "Post para sa ${{ steps.gen.outputs.slug }}" || {
            echo "Walang pagbabago — nauna nang na-render ang araw na ito."; exit 0; }
          # Baka may ibang commit na dumating habang nagre-render tayo.
          for i in 1 2 3; do
            git push && break
            echo "Push failed, rebasing…"; git pull --rebase; sleep 5
          done

      - name: Hintayin ang GitHub Pages
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          URL="https://$OWNER.github.io/$REPO/posts/${{ steps.gen.outputs.slug }}.jpg"
          echo "image_url=$URL" >> "$GITHUB_ENV"

          # Kailangang publiko na ang larawan bago tayo magbukas ng issue —
          # kukunin ito ng Instagram sa URL, hindi tayo makakapag-upload ng file.
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo "000")
            echo "Pages check $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Hindi pa lumalabas ang larawan sa GitHub Pages pagkatapos ng ~7 minuto."
          echo "Tingnan kung naka-on ang Pages: Settings → Pages → Source: main, folder /docs"
          exit 1

      - name: Buksan ang approval issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node bot/issue-body.js \
            --post /tmp/post/post.json \
            --image-url "$image_url" > /tmp/issue.md

          # Ang label ay maaaring wala pa sa bagong repo.
          gh label create "pending-approval" --color "d4a373" \
            --description "Naghihintay ng sagot mo" 2>/dev/null || true

          URL=$(gh issue create \
            --title "Post para sa ${{ steps.gen.outputs.slug }} — approve?" \
            --body-file /tmp/issue.md \
            --label "pending-approval" \
            --assignee "${{ github.repository_owner }}")

          echo "### ✅ Handa na ang post" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Mag-comment ng \`post\` para ilabas, o \`skip\` para laktawan." >> "$GITHUB_STEP_SUMMARY"
