# Ang orasan. Ito lang ang ginagawa nito — ang totoong trabaho ay nasa
# make-post.yml, na ginagamit din ng "skip and generate".
name: Daily post

on:
  schedule:
    # Anim na alarma, hindi isa. Sa public repo, ang orasan ng GitHub ay
    # nahuhuli nang ilang oras at minsan hindi na tumatakbo — at kapag
    # nangyari iyon sa iisang alarma, nawawala ang buong araw.
    #
    # Nakakalat sila sa labing-apat na oras, hindi magkakadikit. Hindi lang
    # ito laban sa nahuhuling orasan: kapag sarado ang Gemini nang ilang
    # oras, ang magkakadikit na alarma ay iisang subok lang ang halaga.
    #
    # Ligtas ang pag-ulit: bago gumalaw, tinitingnan ng make-post.yml kung
    # may post na para sa araw na ito. Kung meron, tahimik itong huhupa.
    # Umaga — dito dapat lumabas ang post.
    - cron: '0 22 * * *'    # 6:00 AM Maynila
    - cron: '15 23 * * *'   # 7:15 AM — kung hindi pumutok ang una
    - cron: '45 0 * * *'    # 8:45 AM
    #
    # Hapon at gabi — para sa araw na sarado ang Gemini buong umaga.
    #
    # Noong Setyembre 7 ay pitong oras na 503 ang inabot ng lahat ng modelo.
    # Tatlong alarma tayo noon, at pawang nasa loob ng dalawa't kalahating
    # oras — kaya iisang saradong pinto ang kinatok nating tatlong beses, at
    # wala nang subok hanggang kinabukasan.
    #
    # Ang post na nagawa ng alas-kuwatro ng hapon ay walang katumbas na
    # kapalit kung wala. Huhupa naman ang mga ito kapag may post na.
    - cron: '30 4 * * *'    # 12:30 PM
    - cron: '0 8 * * *'     # 4:00 PM
    - cron: '0 12 * * *'    # 8:00 PM
  workflow_dispatch:
    inputs:
      date:
        description: 'Petsa (YYYY-MM-DD). Iwan kung ngayon.'
        required: false
      dry:
        description: 'Huwag tawagan ang Gemini — halimbawa lang'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: make-post
  cancel-in-progress: false

jobs:
  make:
    uses: ./.github/workflows/make-post.yml
    secrets: inherit
    with:
      date: ${{ inputs.date }}
      dry:  ${{ inputs.dry == true }}
      variation: 0
      # Ang orasan ay hindi dapat gumawa ng pangalawang post kung may naunang
      # pumutok na. Ang pindot mo ay laging tumutuloy.
      skip_if_exists: ${{ github.event_name == 'schedule' }}
