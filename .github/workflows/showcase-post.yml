# Totoong gawa. Ikaw ang nagpapatakbo nito, hindi ang orasan.
#
# Bago mo ito patakbuhin:
#   1. Ilagay ang larawan sa assets/showcase/ at i-commit
#   2. Basahin ang assets/showcase/README.md — may babala doon tungkol sa
#      email na lumalabas sa mga naka-embed na Google Form
name: Showcase post

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Path sa repo, paghiwalayin ng kuwit. Hanggang 3 (9 kung grid). Ang UNA ang mapupunta sa gitna.'
        required: true
      frame:
        description: 'Ano ang ipinapakita: screen o papel?'
        type: choice
        options: [phone, card, grid]
        default: phone
      blur_below:
        description: 'Burahin ang nasa ibaba ng ilang bahagdan. Tig-isa kada larawan: 0,0,20,20. Iwan sa 0 kung wala.'
        default: '0'
      brief:
        description: 'Ano ang nasa larawan, sa sarili mong salita. Isang pangungusap man lang.'
        required: true
      paper:
        description: 'Kulay ng papel'
        type: choice
        options: [cream, kraft, chalk]
        default: cream
      variation:
        description: 'Ulit. Iwan sa 0 kung una. Taasan kung ayaw mo sa pagkakasulat.'
        default: '0'
      dry:
        description: 'Huwag tawagan ang Gemini — halimbawang teksto lang'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: make-post
  cancel-in-progress: false

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: render/package-lock.json

      - name: Kunin ang naka-imbak na Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('render/package-lock.json') }}

      - name: I-install ang renderer
        working-directory: render
        run: npm ci

      - name: Isulat ang post
        id: gen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL:   ${{ vars.GEMINI_MODEL }}
          IMAGES: ${{ inputs.images }}
          BRIEF:  ${{ inputs.brief }}
        run: |
          set -o pipefail
          ARGS="--out-dir /tmp/post --paper ${{ inputs.paper }} --variation ${{ inputs.variation }}"
          ARGS="$ARGS --frame ${{ inputs.frame }} --blur-below ${{ inputs.blur_below }}"
          [ "${{ inputs.dry }}" = "true" ] && ARGS="$ARGS --dry"
          if ! node bot/showcase.js --images "$IMAGES" --brief "$BRIEF" $ARGS 2>&1 | tee /tmp/gen.log; then
            {
              echo "### ❌ Hindi nagawa ang showcase post"
              echo ""
              echo '```'
              tail -20 /tmp/gen.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "base=$(node -p "require('/tmp/post/post.json').base")" >> "$GITHUB_OUTPUT"

      - name: Gawing larawan
        run: |
          mkdir -p docs/posts
          node render/render.js \
            --in /tmp/post/design.json \
            --out "docs/posts/${{ steps.gen.outputs.base }}.jpg"

      - name: I-commit ang larawan at ang caption
        run: |
          cp /tmp/post/post.json "docs/posts/${{ steps.gen.outputs.base }}.json"

          # Hindi kayang maglista ng folder ang GitHub Pages, kaya tayo na ang
          # gumagawa ng listahan. Ito ang binabasa ng docs/admin.html.
          node bot/index-posts.js
          git config user.name  'anyaya-bot'
          git config user.email 'anyaya-bot@users.noreply.github.com'
          git add "docs/posts/${{ steps.gen.outputs.base }}.jpg" \
                  "docs/posts/${{ steps.gen.outputs.base }}.json" \
                  docs/posts/index.json
          git commit -m "Showcase post ${{ steps.gen.outputs.base }}" || {
            echo "Walang pagbabago."; exit 0; }
          for i in 1 2 3; do
            git push && break
            echo "Push failed, rebasing…"; git pull --rebase; sleep 5
          done

      - name: Hintayin ang GitHub Pages
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO="${{ github.event.repository.name }}"
          URL="https://$OWNER.github.io/$REPO/posts/${{ steps.gen.outputs.base }}.jpg"
          echo "image_url=$URL" >> "$GITHUB_ENV"
          for i in $(seq 1 20); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$URL" || echo "000")
            echo "Pages check $i: HTTP $CODE"
            [ "$CODE" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Hindi pa lumalabas ang larawan sa GitHub Pages pagkatapos ng ~7 minuto."
          exit 1

      - name: Buksan ang approval issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node bot/issue-body.js \
            --post /tmp/post/post.json \
            --image-url "$image_url" > /tmp/issue.md

          {
            echo ""
            echo "> Totoong gawa ito, hindi galing sa araw-araw na ikot."
            echo "> Kung ayaw mo sa pagkakasulat, patakbuhin ulit ang **Showcase post**"
            echo "> na may parehong larawan at taasan ang \`variation\`."
          } >> /tmp/issue.md

          gh label create "pending-approval" --color "d4a373" \
            --description "Naghihintay ng sagot mo" 2>/dev/null || true
          gh label create "showcase" --color "5d6b50" \
            --description "Totoong gawa" 2>/dev/null || true

          TITLE="Post para sa ${{ steps.gen.outputs.base }} — approve?"
          if [ "${{ inputs.dry }}" = "true" ]; then
            TITLE="Post para sa ${{ steps.gen.outputs.base }} — SAMPLE, huwag i-post"
          fi

          URL=$(gh issue create \
            --title "$TITLE" \
            --body-file /tmp/issue.md \
            --label "pending-approval" --label "showcase" \
            --assignee "${{ github.repository_owner }}")

          {
            echo "### ✅ Handa na ang showcase post"
            echo ""
            echo "$URL"
            echo ""
            echo "Mag-comment ng \`post\` para ilabas, o \`skip\` para laktawan."
          } >> "$GITHUB_STEP_SUMMARY"
