<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<!-- Self-hosted, base64-embedded. Walang network call = pareho ang output kahit saan. -->
<link rel="stylesheet" href="fonts.css">
<style>
/* ============================================================
   ANYAYA DESIGNS — social post renderer
   Brand: sage #5d6b50 · kraft · cream · warm gold
   ============================================================ */

:root{
  --sage:        #5d6b50;
  --sage-deep:   #3d4735;
  --sage-soft:   #8a9a7b;
  --kraft:       #c8a882;
  --kraft-deep:  #8b6f4e;
  --cream:       #f7f3ec;
  --cream-warm:  #efe7da;
  --ink:         #2b2721;
  --ink-soft:    #5f5849;
  --gold:        #b0894f;

  --u: 1px;                 /* scale unit, set per size */
  --pad: 96px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px}

body{
  font-family:'Jost',-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:var(--cream);
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

/* ---------- papel: iba-ibang kulay kada araw ---------- */
/* Dati iisang cream lang, kaya anim sa pitong araw ay magkamukha ang
   background. Tatlong tono na ngayon, at ang token lang ang pinapalitan —
   kaya sumusunod ang lahat ng gumagamit ng --cream nang hindi nasisira. */
body[data-paper="kraft"]{ --cream:#ece0cd; --cream-warm:#e4d6bf; --kraft-deep:#7d6242; }
body[data-paper="chalk"]{ --cream:#eceee6; --cream-warm:#e2e6da; }

/* Mas kitang-kita ang butil ng papel kapag mas madilim ang tono. */
body[data-paper="kraft"] .canvas::before{ opacity:.09 }
body[data-paper="chalk"] .canvas::before{ opacity:.05 }

/* ---------- canvas ---------- */
.canvas{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:var(--pad);
  background:var(--cream);
}
body[data-size="square"] .canvas{ height:1080px; --pad:84px; }

/* paper grain — pure CSS/SVG, no external asset */
.canvas::before{
  content:'';
  position:absolute; inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.5'/></svg>");
  opacity:.10;
  mix-blend-mode:multiply;
  pointer-events:none;
  z-index:3;
}
/* soft vignette so edges feel like real paper */
.canvas::after{
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,0) 40%, rgba(139,111,78,.10) 100%);
  pointer-events:none;
  z-index:2;
}

/* ---------- frame rule ---------- */
.frame{
  position:absolute;
  inset:40px;
  border:1px solid rgba(93,107,80,.30);
  z-index:1;
  pointer-events:none;
}
.frame::before{
  content:'';
  position:absolute;
  inset:9px;
  border:1px solid rgba(93,107,80,.16);
}
body[data-size="square"] .frame{inset:34px}

/* ---------- shared blocks ---------- */
.stack{position:relative;z-index:4;display:flex;flex-direction:column;height:100%}
/* content region — vertically balanced above the footer */
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.eyebrow{
  font-size:22px; font-weight:500; letter-spacing:.30em;
  text-transform:uppercase; color:var(--sage);
  display:flex; align-items:center; gap:16px;
}
.eyebrow::after{
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg,rgba(93,107,80,.45),rgba(93,107,80,0));
}

h1{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:400;
  font-size:88px;
  line-height:1.03;
  letter-spacing:-.012em;
  color:var(--sage-deep);
  text-wrap:balance;
}
h1 em{font-style:italic;color:var(--sage)}
h1 b{font-weight:600;font-style:normal}

.body{
  font-size:31px; font-weight:300; line-height:1.52;
  color:var(--ink-soft); max-width:78%;
}

.rule{height:1px;background:rgba(93,107,80,.22)}

/* auto-shrink hooks (JS sets these) */
body[data-fit="s"] h1{font-size:74px}
body[data-fit="xs"] h1{font-size:62px}
body[data-fit="xs"] .body{font-size:28px}

/* ---------- footer ---------- */
.foot{
  margin-top:46px;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding-top:30px;
  border-top:1px solid rgba(93,107,80,.20);
}
.mark{display:flex;align-items:center;gap:26px}
.mark .txt{display:flex;flex-direction:column;gap:7px}
.mark .logo{height:118px;width:auto;display:block;flex:0 0 auto}
.mark .lt{display:none}
[data-variant="feature"] .mark .dk{display:none}
[data-variant="feature"] .mark .lt{display:block}
.mark .name{
  font-family:'Cormorant Garamond',serif;
  font-size:38px; letter-spacing:.10em; color:var(--sage-deep);
}
.mark .kind{
  font-size:17px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--kraft-deep); font-weight:400;
}
.site{
  font-size:20px; letter-spacing:.09em; color:var(--sage);
  text-align:right; font-weight:400; padding-bottom:4px;
}

/* ============================================================
   VARIANT: quote  — one strong statement
   ============================================================ */
[data-variant="quote"] .stack{text-align:left}
[data-variant="quote"] h1{font-size:100px;margin:38px 0 34px}
[data-variant="quote"] .glyph{
  font-family:'Cormorant Garamond',serif;
  font-size:180px; line-height:.62; color:rgba(200,168,130,.55);
  height:96px;
}
[data-variant="quote"] .body{max-width:82%}


/* ============================================================
   VARIANT: tips — numbered list
   ============================================================ */
[data-variant="tips"] h1{font-size:76px;margin:30px 0 46px;max-width:94%}
.list{display:flex;flex-direction:column;gap:30px}
.item{display:flex;gap:28px;align-items:flex-start}
.num{
  flex:0 0 66px; height:66px; border-radius:50%;
  font-variant-numeric:lining-nums; font-feature-settings:'lnum' 1;
  border:1px solid rgba(93,107,80,.42);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:36px; color:var(--sage);
  background:rgba(255,255,255,.5);
}
.item p{font-size:31px;line-height:1.44;color:var(--ink);font-weight:300;padding-top:11px}
.item p strong{font-weight:500;color:var(--sage-deep)}
/* spacing scales with how many items there are, so the block always
   fills the canvas instead of leaving a dead gap at the bottom */
body[data-count="3"] .list{gap:56px}
body[data-count="3"] .item p{font-size:34px}
body[data-count="4"] .list{gap:42px}
body[data-count="5"] .list{gap:26px}
body[data-count="5"] .item p{font-size:28px}
body[data-count="5"] .num{flex-basis:58px;height:58px;font-size:31px}

/* ============================================================
   VARIANT: stat — one big number
   ============================================================ */
[data-variant="stat"] .stack{text-align:center}
[data-variant="stat"] .mid{align-items:center}
[data-variant="stat"] .eyebrow{justify-content:center}
[data-variant="stat"] .eyebrow::after{display:none}
[data-variant="stat"] .eyebrow::before{
  content:''; width:70px; height:1px; background:rgba(93,107,80,.4);
}
.bignum{
  font-family:'Cormorant Garamond',serif;
  font-size:252px; line-height:1.02; font-weight:300;
  color:var(--sage); margin:36px 0 30px;
  letter-spacing:-.02em;
  font-variant-numeric:lining-nums; font-feature-settings:'lnum' 1;
}
.statlabel{
  font-family:'Cormorant Garamond',serif;
  font-size:58px; font-style:italic; color:var(--sage-deep);
  line-height:1.2; max-width:80%; margin-bottom:34px;
}
[data-variant="stat"] .body{text-align:center;max-width:74%}


/* ============================================================
   VARIANT: compare — two columns
   ============================================================ */
[data-variant="compare"] h1{font-size:70px;margin:28px 0 42px}
.cols{display:grid;grid-template-columns:1fr 1px 1fr;gap:40px;flex:0 0 auto}
.coldiv{background:linear-gradient(180deg,rgba(93,107,80,0),rgba(93,107,80,.3),rgba(93,107,80,0))}
.col h3{
  font-size:19px;letter-spacing:.20em;text-transform:uppercase;
  font-weight:500;margin-bottom:26px;padding-bottom:14px;
  border-bottom:1px solid rgba(93,107,80,.22);
}
.col.a h3{color:var(--kraft-deep)}
.col.b h3{color:var(--sage)}
.col ul{list-style:none;display:flex;flex-direction:column;gap:20px}
.col li{
  font-size:26px;line-height:1.4;font-weight:300;
  display:flex;gap:14px;align-items:flex-start;
}
.col li span{flex:0 0 auto;font-size:22px;line-height:1.6}
.col.a li{color:var(--ink-soft)}
.col.a li span{color:rgba(139,111,78,.75)}
.col.b li{color:var(--ink)}
.col.b li span{color:var(--sage)}

/* ============================================================
   VARIANT: question — engagement
   ============================================================ */
[data-variant="question"] .canvas{background:var(--cream-warm)}
[data-variant="question"] .stack{text-align:center}
[data-variant="question"] .mid{align-items:center}
[data-variant="question"] .eyebrow{justify-content:center}
[data-variant="question"] .eyebrow::after{display:none}
[data-variant="question"] h1{
  font-size:118px;font-style:italic;margin:46px 0 36px;max-width:94%;
}
[data-variant="question"] .body{text-align:center;max-width:76%;font-size:36px}

.ornament{
  display:flex;align-items:center;gap:18px;margin:56px 0 8px;
  color:var(--kraft);font-size:26px;
}
.ornament i{display:block;width:64px;height:1px;background:currentColor;opacity:.6}

/* ============================================================
   VARIANT: feature — product spotlight
   ============================================================ */

/* ---------- showcase: totoong gawa, hindi teksto ---------- */
/* Ito ang variant na may hawak na larawan — screenshot ng isang RSVP site,
   o litrato ng isang naka-imprentang card. Ang larawan ang bida; ang teksto
   ay nagbibigay lang ng konteksto. */
[data-variant="showcase"] .stack{text-align:center}
[data-variant="showcase"] .mid{align-items:center;justify-content:center}
[data-variant="showcase"] .eyebrow{justify-content:center}
[data-variant="showcase"] .eyebrow::after{display:none}
[data-variant="showcase"] h1{
  font-size:54px; margin:22px 0 4px; max-width:90%; line-height:1.1;
}
[data-variant="showcase"] .body{
  text-align:center; max-width:78%; font-size:27px; margin-bottom:30px;
}
/* Ang proporsyon ay proporsyon ng totoong telepono (halos 1:2). Kung
   masyadong malapad, tablet ang dating at nawawala ang punto — na sa
   telepono ito bubuksan ng bisita. */
.device{
  width:330px; flex:0 0 auto; margin:0 auto; position:relative;
  border-radius:36px; padding:10px;
  background:linear-gradient(160deg,#2f3529,#1d2119);
  box-shadow:0 26px 58px rgba(45,40,30,.20), 0 3px 10px rgba(45,40,30,.13);
}
.device::after{
  content:''; position:absolute; left:50%; top:19px; transform:translateX(-50%);
  width:84px; height:5px; border-radius:99px; background:rgba(247,243,236,.30);
  z-index:2;
}
.device .screen{
  border-radius:27px; overflow:hidden; background:#fff;
  height:618px; display:block; position:relative;
}
/* Malinis na putol sa ibaba. Kung wala ito, natatapyas ang teksto sa gitna
   ng salita at mukhang aksidente — hindi sinadya. */
.device .screen::after{
  content:''; position:absolute; left:0; right:0; bottom:0; height:74px;
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.92));
}
.device .screen img{
  width:100%; height:100%; display:block;
  object-fit:cover; object-position:top center;
}
/* ---------- card: naka-imprentang papel, hindi screen ---------- */
/* Ang isang invitation ay hindi nakaupo sa loob ng telepono. Walang bezel,
   walang notch — papel lang na may anino, na parang nakapatong sa mesa. */
.card{
  flex:0 0 auto; margin:0 auto; position:relative;
  border-radius:3px; overflow:hidden; background:#fff;
  box-shadow:0 24px 52px rgba(45,40,30,.20), 0 2px 6px rgba(45,40,30,.14);
  /* Ang invitation ay halos 5x7 — mas mataas kaysa malapad, pero hindi
     kasingtaas ng telepono. Kailangan nitong mas malapad para punan ang
     parehong taas, kung hindi ay lumulutang ito sa gitna ng post. */
  width:452px;
}
.card img{width:100%; display:block}
/* Isang buhok na linya sa gilid — kung wala ito, nawawala ang maputing card
   sa maputing papel. */
.card::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(45,40,30,.10);
}
/* ---------- grid: buong suite sa isang tingin ---------- */
/* Kapag walo ang pahina, walang saysay ang malalaking card — ang bilang
   mismo ang mensahe. Maliliit na tile na may sariling anino. */
.grid{
  display:grid; gap:20px; flex:0 0 auto; margin:0 auto; max-width:100%;
  grid-template-columns:repeat(4, 1fr);
}
.grid[data-n="2"],.grid[data-n="4"]{grid-template-columns:repeat(2, 1fr); max-width:520px}
.grid[data-n="3"],.grid[data-n="5"],.grid[data-n="6"],
.grid[data-n="9"]{grid-template-columns:repeat(3, 1fr); max-width:700px}
.grid .tile{
  position:relative; background:#fff; border-radius:2px; overflow:hidden;
  box-shadow:0 10px 22px rgba(45,40,30,.16), 0 1px 3px rgba(45,40,30,.12);
}
.grid .tile::after{
  content:''; position:absolute; inset:0; pointer-events:none;
  box-shadow:inset 0 0 0 1px rgba(45,40,30,.10);
}
.grid .tile img{width:100%; display:block}

/* ---------- blur: para sa listahan ng pangalan ---------- */
/* Ang header ay nananatiling malinaw; ang listahan sa ibaba ay hindi na
   nababasa. Nakikita pa rin ang lawak ng trabaho, wala na ang pangalan. */
.blurwrap{position:relative; overflow:hidden}
.blurwrap img{display:block; width:100%}
.blurwrap .veil{
  position:absolute; left:0; right:0; bottom:0;
  backdrop-filter:blur(9px); -webkit-backdrop-filter:blur(9px);
}

/* "plain" — walang kahon. Para sa larawang may sariling ayos na, gaya ng
   isang buong suite na pinagsama-sama sa isang grid. */
.plainimg{flex:0 0 auto; margin:0 auto; max-width:100%}
.plainimg img{width:100%; display:block}

.cards{display:flex; align-items:flex-start; justify-content:center; flex:0 0 auto; margin:0 auto}
.cards .card{position:relative}
/* 2s + c - 2o <= 888 (ang lapad sa loob ng padding). Kung lalampas,
   pinipiga ng flex ang mga card at nasisira ang proporsyon ng papel. */
.cards[data-n="3"] .card:nth-child(1){width:310px; margin-right:-54px; margin-top:58px; z-index:1}
.cards[data-n="3"] .card:nth-child(2){width:364px; z-index:3}
.cards[data-n="3"] .card:nth-child(3){width:310px; margin-left:-54px;  margin-top:58px; z-index:1}
.cards[data-n="2"] .card{width:372px}
.cards[data-n="2"] .card:nth-child(2){margin-left:-72px; margin-top:56px; z-index:1}
body[data-fit="s"]  .card{width:420px}
body[data-fit="xs"] .card{width:388px}

/* Maraming screen sa isang post. Ang gitna ang bida — mas malaki at nasa
   harap; ang gilid ay bahagyang mas maliit at nakababa, kaya may lalim ang
   pangkat nang hindi kailangang ipihit ang mga ito nang pahilis. */
.devices{
  display:flex; align-items:flex-start; justify-content:center;
  flex:0 0 auto; margin:0 auto;
}
.devices .device{position:relative; margin:0}
/* Ang patong ay maliit lang. Kung malalim, natatakpan ang gitna ng mga
   gilid na screen — at doon mismo nakaupo ang teksto ng site. */
.devices .device:nth-child(1){width:272px; margin-right:-24px; margin-top:46px; z-index:1}
.devices .device:nth-child(2){width:316px; z-index:3}
.devices .device:nth-child(3){width:272px; margin-left:-24px;  margin-top:46px; z-index:1}
.devices .device:nth-child(1) .screen,
.devices .device:nth-child(3) .screen{height:500px}
.devices .device:nth-child(2) .screen{height:578px}
.devices .device:nth-child(1),
.devices .device:nth-child(3){box-shadow:0 18px 40px rgba(45,40,30,.18)}
/* Dalawa lang ang larawan: pantay silang dalawa, walang gitna. */
.devices[data-n="2"] .device:nth-child(1),
.devices[data-n="2"] .device:nth-child(2){width:290px; margin-top:0; z-index:2}
.devices[data-n="2"] .device:nth-child(2){margin-left:-38px; margin-top:46px; z-index:1}
.devices[data-n="2"] .device .screen{height:520px}

body[data-fit="s"]  .devices .device:nth-child(2) .screen{height:536px}
body[data-fit="s"]  .devices .device:nth-child(1) .screen,
body[data-fit="s"]  .devices .device:nth-child(3) .screen{height:462px}
body[data-fit="xs"] .devices .device:nth-child(2) .screen{height:494px}
body[data-fit="xs"] .devices .device:nth-child(1) .screen,
body[data-fit="xs"] .devices .device:nth-child(3) .screen{height:426px}

.chips{
  display:flex; gap:12px; justify-content:center; flex-wrap:wrap;
  margin-top:32px; max-width:94%;
}
.chips span{
  font-family:'Jost',sans-serif; font-weight:400; font-size:22px;
  letter-spacing:.02em; color:var(--sage-deep);
  border:1px solid rgba(93,107,80,.32); border-radius:99px;
  padding:11px 24px; background:rgba(255,255,255,.42);
}
body[data-fit="s"]  [data-variant="showcase"] h1{font-size:48px}
body[data-fit="xs"] [data-variant="showcase"] h1{font-size:43px}
body[data-fit="s"]  .device{width:306px}
body[data-fit="s"]  .device .screen{height:574px}
body[data-fit="xs"] .device{width:288px}
body[data-fit="xs"] .device .screen{height:540px}

/* Sa madilim na papel, mas malapot ang anino at mas maliwanag ang chips. */
[data-variant="showcase"][data-paper="kraft"] .chips span{background:rgba(255,255,255,.36)}

[data-variant="feature"] .canvas{background:linear-gradient(168deg,#5d6b50 0%,#485438 100%)}
/* Ang feature ay laging madilim, pero hindi laging iisang lalim ng sage. */
body[data-paper="chalk"][data-variant="feature"] .canvas{background:linear-gradient(168deg,#3c4433 0%,#242a1e 100%)}
body[data-paper="kraft"][data-variant="feature"] .canvas{background:linear-gradient(168deg,#54604a 0%,#3a4430 100%)}
[data-variant="feature"] .frame{border-color:rgba(247,243,236,.28)}
[data-variant="feature"] .frame::before{border-color:rgba(247,243,236,.15)}
[data-variant="feature"] .eyebrow{color:var(--kraft)}
[data-variant="feature"] .eyebrow::after{background:linear-gradient(90deg,rgba(200,168,130,.5),rgba(200,168,130,0))}
[data-variant="feature"] h1{color:var(--cream);font-size:78px;margin:30px 0 44px}
[data-variant="feature"] h1 em{color:var(--kraft)}
[data-variant="feature"] .item p{color:rgba(247,243,236,.90)}
[data-variant="feature"] .item p strong{color:#fff}
[data-variant="feature"] .num{
  border-color:rgba(200,168,130,.55);color:var(--kraft);
  background:rgba(255,255,255,.06);
}
[data-variant="feature"] .foot{border-top-color:rgba(247,243,236,.22)}
[data-variant="feature"] .mark .name{color:var(--cream)}
[data-variant="feature"] .mark .kind{color:var(--kraft)}
[data-variant="feature"] .site{color:rgba(247,243,236,.72)}
[data-variant="feature"] .canvas::after{
  background:radial-gradient(110% 80% at 50% 30%, rgba(255,255,255,.07), rgba(0,0,0,.18));
}

/* ============================================================
   VARIANT: cta — offer
   ============================================================ */
[data-variant="cta"] .stack{text-align:center}
[data-variant="cta"] .mid{align-items:center}
[data-variant="cta"] .eyebrow{justify-content:center}
[data-variant="cta"] .eyebrow::after{display:none}
[data-variant="cta"] h1{font-size:92px;margin:36px 0 30px;max-width:92%}
[data-variant="cta"] .body{text-align:center;max-width:72%}
.btn{
  margin-top:48px;
  padding:26px 62px;
  border:1px solid var(--sage);
  background:var(--sage);
  color:var(--cream);
  font-size:25px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
}
.seal{
  position:absolute;top:118px;right:112px;z-index:5;
  width:132px;height:132px;border-radius:50%;
  border:1px solid rgba(176,137,79,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--kraft-deep);text-align:center;
  background:rgba(255,255,255,.42);
  transform:rotate(-9deg);
}
.seal b{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:500;line-height:1}
.seal span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:5px}

</style>
</head>
<body data-variant="quote" data-size="portrait">
<div class="canvas">
  <div class="frame"></div>
  <div class="stack" id="stack"></div>
</div>

<script>
// Data is injected by render.js as window.__DATA__
const D = window.__DATA__ || {};
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// allow *italic* and **bold** in headlines
const rich = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\*(.+?)\*/g,'<em>$1</em>');

const variant = D.variant || 'quote';
document.body.dataset.variant = variant;

    const c = D.compare || {};
    const li = (arr, m) => (arr||[]).map(t =>
      `<li><span>${m}</span>${esc(t)}</li>`).join('');
    html = `${eyebrow}<h1>${rich(D.headline)}</h1>
      <div class="cols">
        <div class="col a"><h3>${esc(c.leftTitle||'Dati')}</h3><ul>${li(c.left,'✕')}</ul></div>
        <div class="coldiv"></div>
        <div class="col b"><h3>${esc(c.rightTitle||'Sa Anyaya')}</h3><ul>${li(c.right,'✓')}</ul></div>
      </div>${foot}`;
    break;
  }

  case 'showcase': {
    // Ang larawan ay ipinapasok na base64 ng render.js, kaya walang network
    // call sa oras ng render — pareho ang labas saanman ito tumakbo.
    const chips = (D.items || []).slice(0, 3)
      .map(t => `<span>${esc(t)}</span>`).join('');

    const imgs = (D.images && D.images.length ? D.images : [D.image]).filter(Boolean);

    // "card" para sa naka-imprentang papel, "phone" para sa screen.
    // Magkaibang bagay ang ipinapakita, kaya magkaibang kahon.
    const kind   = D.frame || 'phone';
    const isCard = kind === 'card';
    const wrap   = isCard ? 'cards' : 'devices';

    // Ang blur ay inilalagay sa ibabaw ng larawan, hindi sa larawan mismo —
    // kaya hindi na kailangan ng ibang programa bago i-render.
    // Kada-larawan ang blur. Isang numero = pareho sa lahat; listahan =
    // tig-isa. Kailangan ito dahil sa isang suite, ang listahan lang ng
    // pangalan ang binubura — hindi ang invitation mismo.
    const bb = D.blurBelow;
    const below = i => Number(Array.isArray(bb) ? (bb[i] || 0) : (bb || 0)) || 0;

    const pic = (src, i = 0) => below(i)
      ? `<div class="blurwrap"><img src="${esc(src)}" alt="">` +
        `<div class="veil" style="top:${below(i)}%"></div></div>`
      : `<img src="${esc(src)}" alt="">`;

    const frame  = (src, i) => isCard
      ? `<div class="card">${pic(src, i)}</div>`
      : `<div class="device"><div class="screen">${pic(src, i)}</div></div>`;

    if (kind === 'grid') {
      const tiles = imgs.map((v, i) => `<div class="tile">${pic(v, i)}</div>`).join('');
      html = `${eyebrow}<h1>${rich(D.headline)}</h1>${body}
        <div class="grid" data-n="${imgs.length}">${tiles}</div>
        ${chips ? `<div class="chips">${chips}</div>` : ''}${foot}`;
      break;
    }

    if (kind === 'plain') {
      html = `${eyebrow}<h1>${rich(D.headline)}</h1>${body}
        <div class="plainimg">${pic(imgs[0])}</div>
        ${chips ? `<div class="chips">${chips}</div>` : ''}${foot}`;
      break;
    }

    // Isa lang: nakatayo mag-isa. Marami: pangkat, gitna ang bida.
    // Ang pinakamalakas na larawan ang inilalagay sa gitna — index 0.
    let block;
    if (imgs.length === 1) {
      block = frame(imgs[0]);
    } else if (imgs.length === 2) {
      block = `<div class="${wrap}" data-n="2">${imgs.map((v, i) => frame(v, i)).join('')}</div>`;
    } else {
      // Index 0 ang gitna. Pinapanatili ang tamang blur kahit nagbago ang ayos.
      const order = [1, 0, 2];
      block = `<div class="${wrap}" data-n="3">` +
        order.map(i => frame(imgs[i], i)).join('') + '</div>';
    }

    html = `${eyebrow}<h1>${rich(D.headline)}</h1>${body}
      ${block}
      ${chips ? `<div class="chips">${chips}</div>` : ''}${foot}`;
    break;
  }

  case 'question':
    html = `${eyebrow}<h1>${rich(D.headline)}</h1>${body}
      <div class="ornament"><i></i>&#10022;<i></i></div>${foot}`;
    break;

  case 'cta':
    html = `${eyebrow}<h1>${rich(D.headline)}</h1>${body}
      ${D.cta ? `<div class="btn">${esc(D.cta)}</div>` : ''}${foot}`;
    if (D.seal) {
      const s = document.createElement('div');
      s.className = 'seal';
      s.innerHTML = `<b>${esc(D.seal.top||'')}</b><span>${esc(D.seal.bottom||'')}</span>`;
      document.querySelector('.canvas').appendChild(s);
    }
    break;

  default: // quote
    html = `${eyebrow}<div class="glyph">&ldquo;</div>
      <h1>${rich(D.headline)}</h1>${body}${foot}`;
}

document.getElementById('stack').innerHTML =
  html.replace(/(<div class="foot">)/, '</div>$1').replace(/^/, '<div class="mid">');

// ---- auto-fit: shrink type until content clears the canvas ----
(function fit(){
  const canvas = document.querySelector('.canvas');
  const stack  = document.getElementById('stack');
  const steps  = ['', 's', 'xs'];
  for (const step of steps) {
    document.body.dataset.fit = step;
    const avail = canvas.clientHeight - (parseInt(getComputedStyle(canvas).paddingTop) * 2);
    if (stack.scrollHeight <= avail) return;
  }
})();

// signal to puppeteer that fonts + layout are settled
document.fonts.ready.then(() => {
  requestAnimationFrame(() => { document.body.setAttribute('data-ready','1'); });
});
</script>
</body>
</html>
