<!doctype html>
<html lang="tl">
<head>
<meta charset="utf-8">
<!-- Self-hosted, base64-embedded. Walang network call = pareho ang output kahit saan. -->
<link rel="stylesheet" href="fonts.css">
<style>
/* ============================================================
   ANYAYA DESIGNS — social post renderer
   Brand: sage #5d6b50 · kraft · cream · warm gold
   ============================================================ */

:root{
  --sage:        #5d6b50;
  --sage-deep:   #3d4735;
  --sage-soft:   #8a9a7b;
  --kraft:       #c8a882;
  --kraft-deep:  #8b6f4e;
  --cream:       #f7f3ec;
  --cream-warm:  #efe7da;
  --ink:         #2b2721;
  --ink-soft:    #5f5849;
  --gold:        #b0894f;

  --u: 1px;                 /* scale unit, set per size */
  --pad: 96px;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px}

body{
  font-family:'Jost',-apple-system,'Segoe UI',sans-serif;
  color:var(--ink);
  background:var(--cream);
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
}

/* ---------- canvas ---------- */
.canvas{
  position:relative;
  width:1080px;
  height:1350px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  padding:var(--pad);
  background:var(--cream);
}
body[data-size="square"] .canvas{ height:1080px; --pad:84px; }

/* paper grain — pure CSS/SVG, no external asset */
.canvas::before{
  content:'';
  position:absolute; inset:0;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4'/><feColorMatrix type='saturate' values='0'/></filter><rect width='220' height='220' filter='url(%23n)' opacity='0.5'/></svg>");
  opacity:.10;
  mix-blend-mode:multiply;
  pointer-events:none;
  z-index:3;
}
/* soft vignette so edges feel like real paper */
.canvas::after{
  content:'';
  position:absolute; inset:0;
  background:radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,0) 40%, rgba(139,111,78,.10) 100%);
  pointer-events:none;
  z-index:2;
}

/* ---------- frame rule ---------- */
.frame{
  position:absolute;
  inset:40px;
  border:1px solid rgba(93,107,80,.30);
  z-index:1;
  pointer-events:none;
}
.frame::before{
  content:'';
  position:absolute;
  inset:9px;
  border:1px solid rgba(93,107,80,.16);
}
body[data-size="square"] .frame{inset:34px}

/* ---------- shared blocks ---------- */
.stack{position:relative;z-index:4;display:flex;flex-direction:column;height:100%}
/* content region — vertically balanced above the footer */
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0}

.eyebrow{
  font-size:22px; font-weight:500; letter-spacing:.30em;
  text-transform:uppercase; color:var(--sage);
  display:flex; align-items:center; gap:16px;
}
.eyebrow::after{
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg,rgba(93,107,80,.45),rgba(93,107,80,0));
}

h1{
  font-family:'Cormorant Garamond',Georgia,serif;
  font-weight:400;
  font-size:88px;
  line-height:1.03;
  letter-spacing:-.012em;
  color:var(--sage-deep);
  text-wrap:balance;
}
h1 em{font-style:italic;color:var(--sage)}
h1 b{font-weight:600;font-style:normal}

.body{
  font-size:31px; font-weight:300; line-height:1.52;
  color:var(--ink-soft); max-width:78%;
}

.rule{height:1px;background:rgba(93,107,80,.22)}

/* auto-shrink hooks (JS sets these) */
body[data-fit="s"] h1{font-size:74px}
body[data-fit="xs"] h1{font-size:62px}
body[data-fit="xs"] .body{font-size:28px}

/* ---------- footer ---------- */
.foot{
  margin-top:52px;
  display:flex; align-items:flex-end; justify-content:space-between;
  padding-top:36px;
  border-top:1px solid rgba(93,107,80,.20);
}
.mark{display:flex;flex-direction:column;gap:7px}
.mark .name{
  font-family:'Cormorant Garamond',serif;
  font-size:38px; letter-spacing:.10em; color:var(--sage-deep);
}
.mark .kind{
  font-size:17px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--kraft-deep); font-weight:400;
}
.site{
  font-size:20px; letter-spacing:.09em; color:var(--sage);
  text-align:right; font-weight:400; padding-bottom:4px;
}

/* ============================================================
   VARIANT: quote  — one strong statement
   ============================================================ */
[data-variant="quote"] .stack{text-align:left}
[data-variant="quote"] h1{font-size:100px;margin:38px 0 34px}
[data-variant="quote"] .glyph{
  font-family:'Cormorant Garamond',serif;
  font-size:180px; line-height:.62; color:rgba(200,168,130,.55);
  height:96px;
}
[data-variant="quote"] .body{max-width:82%}


/* ============================================================
   VARIANT: tips — numbered list
   ============================================================ */
[data-variant="tips"] h1{font-size:76px;margin:30px 0 46px;max-width:94%}
.list{display:flex;flex-direction:column;gap:30px}
.item{display:flex;gap:28px;align-items:flex-start}
.num{
  flex:0 0 66px; height:66px; border-radius:50%;
  font-variant-numeric:lining-nums; font-feature-settings:'lnum' 1;
  border:1px solid rgba(93,107,80,.42);
  display:flex;align-items:center;justify-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:36px; color:var(--sage);
  background:rgba(255,255,255,.5);
}
.item p{font-size:31px;line-height:1.44;color:var(--ink);font-weight:300;padding-top:11px}
.item p strong{font-weight:500;color:var(--sage-deep)}
/* spacing scales with how many items there are, so the block always
   fills the canvas instead of leaving a dead gap at the bottom */
body[data-count="3"] .list{gap:56px}
body[data-count="3"] .item p{font-size:34px}
body[data-count="4"] .list{gap:42px}
body[data-count="5"] .list{gap:26px}
body[data-count="5"] .item p{font-size:28px}
body[data-count="5"] .num{flex-basis:58px;height:58px;font-size:31px}

/* ============================================================
   VARIANT: stat — one big number
   ============================================================ */
[data-variant="stat"] .stack{text-align:center}
[data-variant="stat"] .mid{align-items:center}
[data-variant="stat"] .eyebrow{justify-content:center}
[data-variant="stat"] .eyebrow::after{display:none}
[data-variant="stat"] .eyebrow::before{
  content:''; width:70px; height:1px; background:rgba(93,107,80,.4);
}
.bignum{
  font-family:'Cormorant Garamond',serif;
  font-size:252px; line-height:1.02; font-weight:300;
  color:var(--sage); margin:36px 0 30px;
  letter-spacing:-.02em;
  font-variant-numeric:lining-nums; font-feature-settings:'lnum' 1;
}
.statlabel{
  font-family:'Cormorant Garamond',serif;
  font-size:58px; font-style:italic; color:var(--sage-deep);
  line-height:1.2; max-width:80%; margin-bottom:34px;
}
[data-variant="stat"] .body{text-align:center;max-width:74%}


/* ============================================================
   VARIANT: compare — two columns
   ============================================================ */
[data-variant="compare"] h1{font-size:70px;margin:28px 0 42px}
.cols{display:grid;grid-template-columns:1fr 1px 1fr;gap:40px;flex:0 0 auto}
.coldiv{background:linear-gradient(180deg,rgba(93,107,80,0),rgba(93,107,80,.3),rgba(93,107,80,0))}
.col h3{
  font-size:19px;letter-spacing:.20em;text-transform:uppercase;
  font-weight:500;margin-bottom:26px;padding-bottom:14px;
  border-bottom:1px solid rgba(93,107,80,.22);
}
.col.a h3{color:var(--kraft-deep)}
.col.b h3{color:var(--sage)}
.col ul{list-style:none;display:flex;flex-direction:column;gap:20px}
.col li{
  font-size:26px;line-height:1.4;font-weight:300;
  display:flex;gap:14px;align-items:flex-start;
}
.col li span{flex:0 0 auto;font-size:22px;line-height:1.6}
.col.a li{color:var(--ink-soft)}
.col.a li span{color:rgba(139,111,78,.75)}
.col.b li{color:var(--ink)}
.col.b li span{color:var(--sage)}

/* ============================================================
   VARIANT: question — engagement
   ============================================================ */
[data-variant="question"] .canvas{background:var(--cream-warm)}
[data-variant="question"] .stack{text-align:center}
[data-variant="question"] .mid{align-items:center}
[data-variant="question"] .eyebrow{justify-content:center}
[data-variant="question"] .eyebrow::after{display:none}
[data-variant="question"] h1{
  font-size:118px;font-style:italic;margin:46px 0 36px;max-width:94%;
}
[data-variant="question"] .body{text-align:center;max-width:76%;font-size:36px}

.ornament{
  display:flex;align-items:center;gap:18px;margin:56px 0 8px;
  color:var(--kraft);font-size:26px;
}
.ornament i{display:block;width:64px;height:1px;background:currentColor;opacity:.6}

/* ============================================================
   VARIANT: feature — product spotlight
   ============================================================ */
[data-variant="feature"] .canvas{background:linear-gradient(168deg,#5d6b50 0%,#485438 100%)}
[data-variant="feature"] .frame{border-color:rgba(247,243,236,.28)}
[data-variant="feature"] .frame::before{border-color:rgba(247,243,236,.15)}
[data-variant="feature"] .eyebrow{color:var(--kraft)}
[data-variant="feature"] .eyebrow::after{background:linear-gradient(90deg,rgba(200,168,130,.5),rgba(200,168,130,0))}
[data-variant="feature"] h1{color:var(--cream);font-size:78px;margin:30px 0 44px}
[data-variant="feature"] h1 em{color:var(--kraft)}
[data-variant="feature"] .item p{color:rgba(247,243,236,.90)}
[data-variant="feature"] .item p strong{color:#fff}
[data-variant="feature"] .num{
  border-color:rgba(200,168,130,.55);color:var(--kraft);
  background:rgba(255,255,255,.06);
}
[data-variant="feature"] .foot{border-top-color:rgba(247,243,236,.22)}
[data-variant="feature"] .mark .name{color:var(--cream)}
[data-variant="feature"] .mark .kind{color:var(--kraft)}
[data-variant="feature"] .site{color:rgba(247,243,236,.72)}
[data-variant="feature"] .canvas::after{
  background:radial-gradient(110% 80% at 50% 30%, rgba(255,255,255,.07), rgba(0,0,0,.18));
}

/* ============================================================
   VARIANT: cta — offer
   ============================================================ */
[data-variant="cta"] .stack{text-align:center}
[data-variant="cta"] .mid{align-items:center}
[data-variant="cta"] .eyebrow{justify-content:center}
[data-variant="cta"] .eyebrow::after{display:none}
[data-variant="cta"] h1{font-size:92px;margin:36px 0 30px;max-width:92%}
[data-variant="cta"] .body{text-align:center;max-width:72%}
.btn{
  margin-top:48px;
  padding:26px 62px;
  border:1px solid var(--sage);
  background:var(--sage);
  color:var(--cream);
  font-size:25px;letter-spacing:.16em;text-transform:uppercase;font-weight:500;
}
.seal{
  position:absolute;top:118px;right:112px;z-index:5;
  width:132px;height:132px;border-radius:50%;
  border:1px solid rgba(176,137,79,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--kraft-deep);text-align:center;
  background:rgba(255,255,255,.42);
  transform:rotate(-9deg);
}
.seal b{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:500;line-height:1}
.seal span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-top:5px}

</style>
</head>
<body data-variant="quote" data-size="portrait">
<div class="canvas">
  <div class="frame"></div>
  <div class="stack" id="stack"></div>
</div>

<script>
// Data is injected by render.js as window.__DATA__
const D = window.__DATA__ || {};
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// allow *italic* and **bold** in headlines
const rich = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
  .replace(/\*(.+?)\*/g,'<em>$1</em>');

const variant = D.variant || 'quote';
document.body.dataset.variant = variant;
document.body.dataset.size = D.size === 'square' ? 'square' : 'portrait';

const foot = `
  <div class="foot">
    <div class="mark">
      <div class="name">ANYAYA DESIGNS</div>
      <div class="kind">RSVP Websites &middot; Craft Invitations</div>
    </div>
    <div class="site">${esc(D.footer || 'anyayadesigns.github.io/flow')}</div>
  </div>`;

const eyebrow = D.eyebrow ? `<div class="eyebrow">${esc(D.eyebrow)}</div>` : '';
const body    = D.body ? `<p class="body">${esc(D.body)}</p>` : '';
const items   = (D.items || []).map((t,i) =>
  `<div class="item"><div class="num">${i+1}</div><p>${rich(t)}</p></div>`).join('');

let html = '';

switch (variant) {

  case 'tips':
  case 'feature':
    document.body.dataset.count = String((D.items||[]).length);
    html = `${eyebrow}<h1>${rich(D.headline)}</h1><div class="list">${items}</div>${foot}`;
    break;

  case 'stat':
    html = `${eyebrow}
      <div class="bignum">${esc(D.stat && D.stat.value)}</div>
      <div class="statlabel">${rich((D.stat && D.stat.label) || '')}</div>
      ${body}${foot}`;
    break;

  case 'compare': {
    const c = D.compare || {};
    const li = (arr, m) => (arr||[]).map(t =>
      `<li><span>${m}</span>${esc(t)}</li>`).join('');
    html = `${eyebrow}<h1>${rich(D.headline)}</h1>
      <div class="cols">
        <div class="col a"><h3>${esc(c.leftTitle||'Dati')}</h3><ul>${li(c.left,'✕')}</ul></div>
        <div class="coldiv"></div>
        <div class="col b"><h3>${esc(c.rightTitle||'Sa Anyaya')}</h3><ul>${li(c.right,'✓')}</ul></div>
      </div>${foot}`;
    break;
  }

  case 'question':
    html = `${eyebrow}<h1>${rich(D.headline)}</h1>${body}
      <div class="ornament"><i></i>&#10022;<i></i></div>${foot}`;
    break;

  case 'cta':
    html = `${eyebrow}<h1>${rich(D.headline)}</h1>${body}
      ${D.cta ? `<div class="btn">${esc(D.cta)}</div>` : ''}${foot}`;
    if (D.seal) {
      const s = document.createElement('div');
      s.className = 'seal';
      s.innerHTML = `<b>${esc(D.seal.top||'')}</b><span>${esc(D.seal.bottom||'')}</span>`;
      document.querySelector('.canvas').appendChild(s);
    }
    break;

  default: // quote
    html = `${eyebrow}<div class="glyph">&ldquo;</div>
      <h1>${rich(D.headline)}</h1>${body}${foot}`;
}

document.getElementById('stack').innerHTML =
  html.replace(/(<div class="foot">)/, '</div>$1').replace(/^/, '<div class="mid">');

// ---- auto-fit: shrink type until content clears the canvas ----
(function fit(){
  const canvas = document.querySelector('.canvas');
  const stack  = document.getElementById('stack');
  const steps  = ['', 's', 'xs'];
  for (const step of steps) {
    document.body.dataset.fit = step;
    const avail = canvas.clientHeight - (parseInt(getComputedStyle(canvas).paddingTop) * 2);
    if (stack.scrollHeight <= avail) return;
  }
})();

// signal to puppeteer that fonts + layout are settled
document.fonts.ready.then(() => {
  requestAnimationFrame(() => { document.body.setAttribute('data-ready','1'); });
});
</script>
</body>
</html>
